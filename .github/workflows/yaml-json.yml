name: yaml-json
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Lint YAML
        run: pipx run --spec yamllint==1.38.0 yamllint .
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        uses: dcarbone/install-yq-action@v1.3.1
        with:
          version: v4.53.6
      - name: Format YAML and JSON
        run: |
          git ls-files -z '*.yml' '*.yaml' '*.json' | while IFS= read -r -d '' file; do
            case "$file" in
              *.json) yq -iP -o=json '.' "$file" ;;
              *) yq -iP '.' "$file" ;;
            esac
          done
      - name: Check formatting
        run: git diff --exit-code
